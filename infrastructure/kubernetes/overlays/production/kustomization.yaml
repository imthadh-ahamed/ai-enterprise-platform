apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

patchesStrategicMerge:
  - patches/api-gateway-replicas.yaml

patches:
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

images:
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/ai-platform/api-gateway
    newTag: "$(IMAGE_TAG)"

commonLabels:
  environment: production

configMapGenerator:
  - name: platform-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn
